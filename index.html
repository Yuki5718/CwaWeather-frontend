<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>臺北市 | 零度空間天氣站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* === 賽博龐克配色變數 === */
      :root {
        --cp-dark-bg: #12121e; /* 深夜藍黑 */
        --cp-neon-blue: #00e5ff; /* 霓虹藍 */
        --cp-neon-pink: #ff00ff; /* 霓虹粉/紫紅 */
        --cp-neon-green: #39ff14; /* 霓虹綠 */
        --cp-text-light: #f0f0f0; /* 淺灰科技字體 */
        --cp-card-bg: rgba(2, 2, 10, 0.7); /* 半透明暗色卡片背景 */
        --cp-border-glitch: #8a2be2; /* 故障紫色 */
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Roboto Mono", monospace; /* 科技感字體 */
        background-color: var(--cp-dark-bg);
        /* 替換為賽博龐克背景圖，例如有摩天大樓或電路板的深色夜景 */
        /* 請自行替換為Unsplash或圖庫素材的URL */
        background-image: url("background-placeholder.jpg");
        /*  */
        background-size: cover;
        background-attachment: fixed;
        min-height: 100vh;
        color: var(--cp-text-light);
        overflow-x: hidden;
        padding-bottom: 20px;
        position: relative;
        /* 增加掃描線疊層效果 (Optional) */
        /* filter: contrast(110%); */
      }

      /* 頂部狀態列 */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: rgba(0, 0, 0, 0.4); /* 更深色的透明背景 */
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 2px solid var(--cp-neon-blue); /* 霓虹藍邊框 */
        text-shadow: 0 0 5px var(--cp-neon-blue); /* 霓虹發光 */
      }

      .location-pill {
        background: var(--cp-neon-pink);
        color: var(--cp-dark-bg);
        padding: 5px 15px;
        border-radius: 4px; /* 銳利邊角 */
        font-weight: 700;
        font-size: 1.1rem;
        transform: none; /* 移除旋轉 */
        border: 2px solid var(--cp-neon-blue);
        box-shadow: 0 0 10px var(--cp-neon-pink), 0 0 2px var(--cp-neon-pink); /* 霓虹光暈 */
        animation: glitch-anim 2s infinite alternate steps(1); /* 故障效果 */
      }

      @keyframes glitch-anim {
        0% {
          transform: translate(1px, 1px);
        }
        50% {
          transform: translate(-1px, -1px);
        }
        100% {
          transform: translate(0, 0);
        }
      }

      .update-pill {
        font-size: 0.8rem;
        color: var(--cp-neon-green);
        background: rgba(0, 0, 0, 0.3);
        padding: 4px 10px;
        border-radius: 2px;
        border: 1px solid var(--cp-neon-green);
        text-shadow: 0 0 4px var(--cp-neon-green);
      }

      .container {
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }

      /* === 核心：今日焦點卡片 === */
      .hero-card {
        background: var(--cp-card-bg);
        border-radius: 8px; /* 銳利邊角 */
        /* 【主要修改】將頂部內邊距增加到 50px */
        padding: 50px 25px 30px 25px;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); /* 藍色環境光 */
        border: 2px solid var(--cp-neon-blue);
        margin-bottom: 25px;
        position: relative;
        overflow: hidden; /* 隱藏邊緣多餘效果 */
      }

      /* 頂部霓虹燈條 */
      .hero-period {
        position: absolute;
        /* 【主要修改】減少向上偏移量到 -5px */
        top: -5px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--cp-neon-blue);
        color: var(--cp-dark-bg);
        padding: 5px 20px;
        border-radius: 4px;
        font-weight: bold;
        border: 3px solid var(--cp-text-light);
        box-shadow: 0 0 15px var(--cp-neon-blue);
      }

      .hero-temp-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 15px;
        margin: 15px 0;
      }

      .hero-icon {
        font-size: 5.5rem;
        filter: drop-shadow(0 0 10px var(--cp-neon-green)); /* 綠色光暈圖標 */
        animation: neon-pulse 3s infinite alternate; /* 霓虹閃爍 */
        line-height: 1;
      }

      @keyframes neon-pulse {
        0% {
          text-shadow: 0 0 5px var(--cp-neon-green);
        }
        100% {
          text-shadow: 0 0 20px var(--cp-neon-green),
            0 0 5px var(--cp-neon-green);
        }
      }

      .hero-temp {
        font-size: 5rem;
        font-weight: 700;
        color: var(--cp-neon-blue);
        line-height: 1;
        text-shadow: 0 0 15px var(--cp-neon-blue);
      }

      .hero-desc {
        font-size: 1.5rem;
        color: var(--cp-neon-pink);
        margin-bottom: 20px;
        font-weight: bold;
        text-shadow: 0 0 5px var(--cp-neon-pink);
      }

      /* === 快速建議區 (資訊面板) === */
      .advice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px dashed var(--cp-neon-blue);
      }

      .advice-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(255, 255, 255, 0.05); /* 略帶透明感的淺色面板 */
        padding: 15px 10px;
        border-radius: 4px;
        border: 1px solid rgba(0, 229, 255, 0.2);
      }

      .advice-icon {
        font-size: 2.5rem;
        margin-bottom: 5px;
        filter: drop-shadow(0 0 4px var(--cp-neon-pink));
      }

      .advice-text {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--cp-neon-pink);
        margin: 5px 0;
        line-height: 1.2;
        text-shadow: 0 0 2px var(--cp-neon-pink);
      }

      .advice-item div:last-child {
        font-size: 0.8rem !important;
        color: var(--cp-neon-green) !important;
        margin-top: 5px;
      }

      /* === 稍後預報：橫向滑動區 === */
      .section-title {
        font-size: 1.2rem;
        color: var(--cp-neon-blue);
        margin-bottom: 15px;
        margin-left: 10px;
        font-weight: 700;
        text-shadow: 0 0 5px var(--cp-neon-blue);
        border-left: 3px solid var(--cp-neon-pink);
        padding-left: 10px;
      }

      .scroll-container {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding: 0 10px 10px 10px; /* 增加左右邊距 */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .scroll-container::-webkit-scrollbar {
        display: none;
      }

      .mini-card {
        min-width: 140px;
        background: var(--cp-card-bg);
        border-radius: 6px;
        padding: 20px 15px;
        text-align: center;
        border: 1px solid rgba(0, 229, 255, 0.1);
        flex-shrink: 0;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);
      }

      .mini-time {
        background: var(--cp-neon-blue);
        color: var(--cp-dark-bg);
        padding: 3px 10px;
        border-radius: 2px;
        font-size: 0.8rem;
        display: inline-block;
        margin-bottom: 10px;
        font-weight: bold;
      }

      .mini-icon {
        font-size: 3rem;
        margin: 5px 0;
        filter: drop-shadow(0 0 4px var(--cp-neon-green));
      }

      .mini-temp {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--cp-text-light);
      }

      /* 小卡片的降雨率 */
      .mini-card div:last-child {
        font-size: 0.8rem;
        color: var(--cp-neon-pink);
        margin-top: 5px;
      }

      /* Loading 畫面 */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--cp-dark-bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      /* 修改 Loading 動畫，使其具有科技感 */
      .loading-screen div {
        font-size: 4rem;
        animation: scanline-glitch 0.5s infinite alternate;
        color: var(--cp-neon-blue);
        text-shadow: 0 0 15px var(--cp-neon-blue);
      }

      @keyframes scanline-glitch {
        0% {
          opacity: 1;
          transform: skewX(0deg) translateY(0);
        }
        50% {
          opacity: 0.8;
          transform: skewX(-5deg) translateY(5px);
        }
        100% {
          opacity: 1;
          transform: skewX(5deg) translateY(-5px);
        }
      }

      .loading-screen p {
        color: var(--cp-neon-green);
        font-weight: bold;
        margin-top: 20px;
        text-shadow: 0 0 5px var(--cp-neon-green);
      }
    </style>
  </head>

  <body>
    <div id="loading" class="loading-screen">
      <div style="font-size: 4rem">⚡️</div>
      <p>正在從「數據中心-臺北」下載天氣數據...</p>
    </div>

    <div class="status-bar">
      <div class="location-pill">📍 臺北市</div>
      <div id="updateTime" class="update-pill">資料同步中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none">
      <div id="heroCard"></div>

      <h3 class="section-title">數據記錄：預報初始化</h3>
      <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
      const API_URL =
        "https://yuki-cwaweather-api.zeabur.app/api/weather/taipei";

      function getWeatherIcon(weather) {
        if (!weather) return "🌤️";
        if (weather.includes("晴")) return "☀️";
        if (weather.includes("多雲")) return "⛅";
        if (weather.includes("陰")) return "☁️";
        if (weather.includes("雨")) return "🌧️";
        if (weather.includes("雷")) return "⛈️";
        return "🌤️";
      }

      function getAdvice(rainProb, maxTemp) {
        let rainIcon = "🌂";
        let rainText = "不用帶傘";
        if (parseInt(rainProb) > 30) {
          rainIcon = "☂️";
          // 英文 (部署雨傘防禦)
          rainText = "部署雨傘防禦";
        }

        let clothIcon = "👕";
        let clothText = "舒適穿搭";
        if (parseInt(maxTemp) >= 28) {
          clothIcon = "🎽";
          // 英文 (輕量化著裝)
          clothText = "輕量化著裝";
        } else if (parseInt(maxTemp) <= 20) {
          clothIcon = "🧥";
          // 英文 (啟動保暖模組)
          clothText = "啟動保暖模組";
        }

        return { rainIcon, rainText, clothIcon, clothText };
      }

      function getTimePeriod(startTime) {
        const hour = new Date(startTime).getHours();
        // 英文 (系統啟動-早晨)
        if (hour >= 5 && hour < 11) return "系統啟動-早晨";
        if (hour >= 11 && hour < 14) return "核心運算-中午";
        if (hour >= 14 && hour < 18) return "數據分析-下午";
        if (hour >= 18 && hour < 23) return "夜間巡邏-晚上";
        return "休眠模式-深夜";
      }

      function renderWeather(data) {
        const forecasts = data.forecasts;
        const current = forecasts[0];
        const others = forecasts.slice(1);

        // 1. 渲染 Hero Card (主畫面)
        const advice = getAdvice(current.rain, current.maxTemp);
        const period = getTimePeriod(current.startTime);
        const avgTemp = Math.round(
          (parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2
        );

        document.getElementById("heroCard").innerHTML = `
						<div class="hero-card">
							<div class="hero-period">${period}</div>
							<div class="hero-temp-container">
								<div class="hero-icon">${getWeatherIcon(current.weather)}</div>
								<div class="hero-temp">${avgTemp}°</div>
							</div>
							<div class="hero-desc">${current.weather} / 氣候鎖定</div>
							
							<div class="advice-grid">
								<div class="advice-item">
									<div class="advice-icon">${advice.rainIcon}</div>
									<div class="advice-text">${advice.rainText}</div>
									<div style="font-size:0.7rem; color:#999">降雨機率 ${current.rain}</div>
								</div>
								<div class="advice-item">
									<div class="advice-icon">${advice.clothIcon}</div>
									<div class="advice-text">${advice.clothText}</div>
									<div style="font-size:0.7rem; color:#999">最高溫度 ${current.maxTemp}°</div>
								</div>
							</div>
						</div>
					`;

        // 2. 渲染稍後預報 (包含明天判斷)
        const scrollContainer = document.getElementById("futureForecasts");
        scrollContainer.innerHTML = "";

        const todayDate = new Date().getDate();

        others.forEach((f) => {
          let p = getTimePeriod(f.startTime);

          const fDate = new Date(f.startTime);
          if (fDate.getDate() !== todayDate) {
            // 英文文字 [Next Cycle] 改為中文
            p = "[下一個週期] " + p;
          }

          scrollContainer.innerHTML += `
								<div class="mini-card">
									<div class="mini-time">${p}</div>
									<div class="mini-icon">${getWeatherIcon(f.weather)}</div>
									<div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
									<div style="font-size:0.8rem; color:#888; margin-top:5px;">💧 降雨率 ${
                    f.rain
                  }</div>
								</div>
						`;
        });

        // 3. 右上角顯示今日日期
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        // 英文星期改為中文
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        document.getElementById(
          "updateTime"
          // 英文 `[${month}/${date}/${days[dayIndex]}] | 數據傳輸完成` 改為中文
        ).textContent = `[${month}/${date}/${days[dayIndex]}] | 數據傳輸完成`;
      }

      async function fetchWeather() {
        try {
          const delayPromise = new Promise((resolve) =>
            setTimeout(resolve, 1500)
          );

          const fetchPromise = fetch(API_URL).then((res) => res.json());

          const [_, json] = await Promise.all([delayPromise, fetchPromise]);

          if (json.success) {
            renderWeather(json.data);

            document.getElementById("loading").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
          } else {
            throw new Error("API Error");
          }
        } catch (e) {
          console.error(e);
          // 錯誤訊息改為中文
          alert("天氣數據傳輸失敗！外部網路連線已中斷。");
        }
      }

      document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
  </body>
</html>
